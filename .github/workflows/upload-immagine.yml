name: Carica immagine da ZeroTwo

on:
  repository_dispatch:
    types: [upload_immagine]

permissions:
  contents: write

jobs:
  carica-immagine:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Controlla numero foto
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys

          try:
              numero = int(os.environ["NUMERO"])
          except:
              print("ERRORE: numero non valido")
              sys.exit(1)

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          foto = next(
              (x for x in dati if int(x["numero"]) == numero),
              None
          )

          if foto is None:
              print(f"ERRORE: foto numero {numero} non presente in lista-foto.json")
              sys.exit(1)

          print(f'Foto trovata: {numero}. {foto["nome"]} ({foto["tipo"]})')
          PY

      - name: Scarica e rinomina immagine
        env:
          IMAGE_URL: ${{ github.event.client_payload.immagine }}
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          set -e

          if [[ ! "$NUMERO" =~ ^[0-9]+$ ]]; then
            echo "ERRORE: numero non valido"
            exit 1
          fi

          curl -fL "$IMAGE_URL" -o immagine_temp

          TIPO=$(file --mime-type -b immagine_temp)

          case "$TIPO" in
            image/png)
              EXT="png"
              ;;
            image/jpeg)
              EXT="jpg"
              ;;
            image/webp)
              EXT="webp"
              ;;
            image/gif)
              EXT="gif"
              ;;
            image/avif)
              EXT="avif"
              ;;
            *)
              echo "ERRORE: formato non supportato: $TIPO"
              rm -f immagine_temp
              exit 1
              ;;
          esac

          rm -f "${NUMERO}.png"
          rm -f "${NUMERO}.jpg"
          rm -f "${NUMERO}.jpeg"
          rm -f "${NUMERO}.webp"
          rm -f "${NUMERO}.gif"
          rm -f "${NUMERO}.avif"

          mv immagine_temp "${NUMERO}.${EXT}"

          echo "Immagine salvata come ${NUMERO}.${EXT}"

      - name: Aggiorna lista foto
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          python3 <<'PY'
          import json
          import os

          numero = int(os.environ["NUMERO"])

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          for foto in dati:
              if int(foto["numero"]) == numero:
                  foto["caricata"] = True

          with open("lista-foto.json", "w", encoding="utf-8") as f:
              json.dump(
                  dati,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          verticali = sorted(
              [x for x in dati if x["tipo"].lower() == "verticale"],
              key=lambda x: int(x["numero"])
          )

          orizzontali = sorted(
              [x for x in dati if x["tipo"].lower() == "orizzontale"],
              key=lambda x: int(x["numero"])
          )

          with open("LISTA_FOTO.md", "w", encoding="utf-8") as f:
              f.write("# FOTO VERTICALI\n\n")

              for foto in verticali:
                  stato = "✅ caricata" if foto["caricata"] else "❌ non caricata"
                  f.write(f'{foto["numero"]}. {foto["nome"]} = {stato}\n\n')

              f.write("---\n\n")
              f.write("# FOTO ORIZZONTALI\n\n")

              for foto in orizzontali:
                  stato = "✅ caricata" if foto["caricata"] else "❌ non caricata"
                  f.write(f'{foto["numero"]}. {foto["nome"]} = {stato}\n\n')

          print("Lista aggiornata.")
          PY

      - name: Salva modifiche nel repository
        id: salva_upload
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FOTO=$(find . -maxdepth 1 -type f \( \
            -name "${NUMERO}.png" -o \
            -name "${NUMERO}.jpg" -o \
            -name "${NUMERO}.jpeg" -o \
            -name "${NUMERO}.webp" -o \
            -name "${NUMERO}.gif" -o \
            -name "${NUMERO}.avif" \
          \) | head -n 1)

          if [ -z "$FOTO" ]; then
            echo "caricata=false" >> "$GITHUB_OUTPUT"
            echo "ERRORE: foto ${NUMERO} non trovata."
            exit 1
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "caricata=true" >> "$GITHUB_OUTPUT"
            echo "Foto già presente e nessuna modifica necessaria."
            exit 0
          fi

          git commit -m "Caricata foto ${NUMERO} e aggiornata lista"
          git push

          git fetch origin main

          if git ls-tree -r origin/main --name-only | grep -Eq "^${NUMERO}\.(png|jpg|jpeg|webp|gif|avif)$"; then
            echo "caricata=true" >> "$GITHUB_OUTPUT"
            echo "Foto ${NUMERO} verificata su GitHub."
          else
            echo "caricata=false" >> "$GITHUB_OUTPUT"
            echo "ERRORE: foto ${NUMERO} non presente su GitHub."
            exit 1
          fi

      - name: Aggiorna lista su Discord
        if: steps.salva_upload.outputs.caricata == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -e

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "ERRORE: DISCORD_WEBHOOK_URL non configurato"
            exit 1
          fi

          python3 <<'PY'
          import json

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          verticali = sorted(
              [x for x in dati if x["tipo"].lower() == "verticale"],
              key=lambda x: int(x["numero"])
          )

          orizzontali = sorted(
              [x for x in dati if x["tipo"].lower() == "orizzontale"],
              key=lambda x: int(x["numero"])
          )

          def crea_lista(lista):
              righe = []

              for foto in lista:
                  stato = "✅ caricata" if foto["caricata"] else "❌ non caricata"
                  righe.append(
                      f'{foto["numero"]}. {foto["nome"]} = {stato}'
                  )

              return "\n".join(righe)

          payload = {
              "username": "ZeroTwo",
              "embeds": [
                  {
                      "title": "📱 FOTO VERTICALI",
                      "description": crea_lista(verticali)
                  },
                  {
                      "title": "🖥️ FOTO ORIZZONTALI",
                      "description": crea_lista(orizzontali)
                  }
              ]
          }

          with open("discord-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          if [ -f discord-message-id.txt ]; then

            MESSAGE_ID=$(cat discord-message-id.txt)

            HTTP_CODE=$(curl \
              -sS \
              -o discord-response.txt \
              -w "%{http_code}" \
              -X PATCH \
              -H "Content-Type: application/json" \
              -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
              --data-binary @discord-payload.json \
              "${DISCORD_WEBHOOK_URL}/messages/${MESSAGE_ID}")

            echo "Discord HTTP: $HTTP_CODE"
            cat discord-response.txt || true

            if [ "$HTTP_CODE" != "200" ]; then
              exit 1
            fi

          else

            HTTP_CODE=$(curl \
              -sS \
              -o discord-response.json \
              -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
              --data-binary @discord-payload.json \
              "${DISCORD_WEBHOOK_URL}?wait=true")

            echo "Discord HTTP: $HTTP_CODE"
            cat discord-response.json || true

            if [ "$HTTP_CODE" != "200" ]; then
              exit 1
            fi

            python3 <<'PY'
          import json

          with open("discord-response.json", "r", encoding="utf-8") as f:
              risposta = json.load(f)

          message_id = risposta["id"]

          with open("discord-message-id.txt", "w", encoding="utf-8") as f:
              f.write(message_id)

          print("ID messaggio Discord:", message_id)
          PY

          fi

          rm -f discord-payload.json
          rm -f discord-response.txt
          rm -f discord-response.json

      - name: Salva ID messaggio Discord
        if: steps.salva_upload.outputs.caricata == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add discord-message-id.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Salvato ID messaggio Discord"
          git push

      - name: Conferma caricamento riuscito su Discord
        if: always() && steps.salva_upload.outputs.caricata == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          curl --fail-with-body -sS \
            -H "Content-Type: application/json" \
            -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
            -d "{\"content\":\"✅ **Foto ${NUMERO} caricata correttamente su GitHub.**\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Conferma caricamento fallito su Discord
        if: always() && steps.salva_upload.outputs.caricata != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          curl --fail-with-body -sS \
            -H "Content-Type: application/json" \
            -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
            -d "{\"content\":\"❌ **ERRORE: la foto ${NUMERO} NON è stata caricata su GitHub.** Controlla GitHub Actions.\"}" \
            "$DISCORD_WEBHOOK_URL"
