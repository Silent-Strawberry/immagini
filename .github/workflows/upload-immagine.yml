      - name: Aggiorna lista foto
          TROVATA=false

          for EXT in png jpg jpeg webp gif avif; do
            FILE="${NUMERO}.${EXT}"

            if [ -f "$FILE" ]; then
              echo "Cancello $FILE"
              rm -f "$FILE"
              TROVATA=true
            fi
          done

          if [ "$TROVATA" = false ]; then
            echo "ATTENZIONE: nessuna immagine trovata per il numero $NUMERO"
          else
            echo "Immagine $NUMERO cancellata."
          fi

