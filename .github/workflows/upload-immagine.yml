name: Carica immagine da ZeroTwo

on:
  repository_dispatch:
    types: [upload_immagine]

permissions:
  contents: write

jobs:
  carica-immagine:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Controlla numero foto
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys

          numero = int(os.environ["NUMERO"])

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          foto = next((x for x in dati if int(x["numero"]) == numero), None)

          if foto is None:
              print(f"ERRORE: foto numero {numero} non presente in lista-foto.json")
              sys.exit(1)

          print(f'Foto trovata: {numero}. {foto["nome"]} ({foto["tipo"]})')
          PY

      - name: Scarica e rinomina immagine
        env:
          IMAGE_URL: ${{ github.event.client_payload.immagine }}
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          set -e

          if [[ ! "$NUMERO" =~ ^[0-9]+$ ]]; then
            echo "ERRORE: numero non valido"
            exit 1
          fi

          curl -fL "$IMAGE_URL" -o immagine_temp

          TIPO=$(file --mime-type -b immagine_temp)

          case "$TIPO" in
            image/png)
              EXT="png"
              ;;
            image/jpeg)
              EXT="jpg"
              ;;
            image/webp)
              EXT="webp"
              ;;
            image/gif)
              EXT="gif"
              ;;
            image/avif)
              EXT="avif"
              ;;
            *)
              echo "ERRORE: formato non supportato: $TIPO"
              rm -f immagine_temp
              exit 1
              ;;
          esac

          rm -f "${NUMERO}.png"
          rm -f "${NUMERO}.jpg"
          rm -f "${NUMERO}.jpeg"
          rm -f "${NUMERO}.webp"
          rm -f "${NUMERO}.gif"
          rm -f "${NUMERO}.avif"

          mv immagine_temp "${NUMERO}.${EXT}"

          echo "Immagine salvata come ${NUMERO}.${EXT}"

      - name: Aggiorna lista foto
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          python3 <<'PY'
          import json
          import os

          numero = int(os.environ["NUMERO"])

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          for foto in dati:
              if int(foto["numero"]) == numero:
                  foto["caricata"] = True

          with open("lista-foto.json", "w", encoding="utf-8") as f:
              json.dump(dati, f, ensure_ascii=False, indent=2)

          verticali = sorted(
              [x for x in dati if x["tipo"].lower() == "verticale"],
              key=lambda x: int(x["numero"])
          )

          orizzontali = sorted(
              [x for x in dati if x["tipo"].lower() == "orizzontale"],
              key=lambda x: int(x["numero"])
          )

          with open("LISTA_FOTO.md", "w", encoding="utf-8") as f:
              f.write("# FOTO VERTICALI\n\n")
              for foto in verticali:
                  stato = "✅ caricata" if foto["caricata"] else "❌ non caricata"
                  f.write(f'{foto["numero"]}. {foto["nome"]} = {stato}\n\n')

              f.write("---\n\n")

              f.write("# FOTO ORIZZONTALI\n\n")
              for foto in orizzontali:
                  stato = "✅ caricata" if foto["caricata"] else "❌ non caricata"
                  f.write(f'{foto["numero"]}. {foto["nome"]} = {stato}\n\n')

          print("Lista aggiornata.")
          PY

      - name: Aggiorna lista su Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK_URL"]

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          verticali = sorted(
              [x for x in dati if x["tipo"].lower() == "verticale"],
              key=lambda x: int(x["numero"])
          )

          orizzontali = sorted(
              [x for x in dati if x["tipo"].lower() == "orizzontale"],
              key=lambda x: int(x["numero"])
          )

          def crea_lista(lista):
              righe = []

              for foto in lista:
                  stato = "✅ caricata" if foto["caricata"] else "❌ non caricata"

                  righe.append(
                      f'{foto["numero"]}. {foto["nome"]} = {stato}'
                  )

              return "\n".join(righe)

          payload = {
              "username": "Lista Foto",
              "embeds": [
                  {
                      "title": "📱 FOTO VERTICALI",
                      "description": crea_lista(verticali)
                  },
                  {
                      "title": "🖥️ FOTO ORIZZONTALI",
                      "description": crea_lista(orizzontali)
                  }
              ]
          }

          # Se abbiamo già l'ID del messaggio, lo aggiorniamo
          if os.path.exists("discord-message-id.txt"):

              with open("discord-message-id.txt", "r") as f:
                  message_id = f.read().strip()

              url = f"{webhook}/messages/{message_id}"

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="PATCH"
              )

              with urllib.request.urlopen(request) as response:
                  print("Messaggio Discord aggiornato.")

          # Prima esecuzione: crea il messaggio
          else:

              url = webhook + "?wait=true"

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  risposta = json.loads(
                      response.read().decode("utf-8")
                  )

              message_id = risposta["id"]

              with open("discord-message-id.txt", "w") as f:
                  f.write(message_id)

              print("Creato nuovo messaggio Discord:", message_id)
          PY

      - name: Salva modifiche nel repository
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nessuna modifica."
            exit 0
          fi

          git commit -m "Caricata foto ${NUMERO} e aggiornata lista"
          git push
