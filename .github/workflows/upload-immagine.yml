name: Cancella immagine da ZeroTwo

on:
  repository_dispatch:
    types: [delete_immagine]

permissions:
  contents: write

jobs:
  cancella-immagine:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Controlla numero foto
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys

          numero = int(os.environ["NUMERO"])

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          foto = next(
              (x for x in dati if int(x["numero"]) == numero),
              None
          )

          if foto is None:
              print(f"ERRORE: foto numero {numero} non presente nella lista")
              sys.exit(1)

          print(f'Foto trovata: {numero}. {foto["nome"]}')
          PY

      - name: Cancella immagine
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          set -e

          if [[ ! "$NUMERO" =~ ^[0-9]+$ ]]; then
            echo "ERRORE: numero non valido"
            exit 1
          fi

          TROVATA=false

          for EXT in png jpg jpeg webp gif avif; do
            FILE="${NUMERO}.${EXT}"

            if [ -f "$FILE" ]; then
              echo "Cancello $FILE"
              rm -f "$FILE"
              TROVATA=true
            fi
          done

          if [ "$TROVATA" = false ]; then
            echo "ATTENZIONE: nessuna immagine trovata per il numero $NUMERO"
          else
            echo "Immagine $NUMERO cancellata."
          fi

      - name: Imposta foto come non caricata
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          python3 <<'PY'
          import json
          import os

          numero = int(os.environ["NUMERO"])

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          for foto in dati:
              if int(foto["numero"]) == numero:
                  foto["caricata"] = False

          with open("lista-foto.json", "w", encoding="utf-8") as f:
              json.dump(
                  dati,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Foto {numero} impostata come NON CARICATA.")
          PY

      - name: Rigenera lista foto
        run: |
          python3 <<'PY'
          import json

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          verticali = sorted(
              [x for x in dati if x["tipo"].lower() == "verticale"],
              key=lambda x: int(x["numero"])
          )

          orizzontali = sorted(
              [x for x in dati if x["tipo"].lower() == "orizzontale"],
              key=lambda x: int(x["numero"])
          )

          with open("LISTA_FOTO.md", "w", encoding="utf-8") as f:

              f.write("# FOTO VERTICALI\n\n")

              for foto in verticali:
                  stato = "✅ caricata" if foto["caricata"] else "❌ non caricata"
                  f.write(
                      f'{foto["numero"]}. {foto["nome"]} = {stato}\n\n'
                  )

              f.write("---\n\n")

              f.write("# FOTO ORIZZONTALI\n\n")

              for foto in orizzontali:
                  stato = "✅ caricata" if foto["caricata"] else "❌ non caricata"
                  f.write(
                      f'{foto["numero"]}. {foto["nome"]} = {stato}\n\n'
                  )

          print("LISTA_FOTO.md aggiornata.")
          PY

      - name: Aggiorna lista su Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -e

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "ERRORE: DISCORD_WEBHOOK_URL non configurato"
            exit 1
          fi

          if [ ! -f discord-message-id.txt ]; then
            echo "ERRORE: discord-message-id.txt non trovato"
            exit 1
          fi

          MESSAGE_ID=$(cat discord-message-id.txt)

          python3 <<'PY'
          import json

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          verticali = sorted(
              [x for x in dati if x["tipo"].lower() == "verticale"],
              key=lambda x: int(x["numero"])
          )

          orizzontali = sorted(
              [x for x in dati if x["tipo"].lower() == "orizzontale"],
              key=lambda x: int(x["numero"])
          )

          def crea_lista(lista):
              righe = []

              for foto in lista:
                  stato = "✅ caricata" if foto["caricata"] else "❌ non caricata"

                  righe.append(
                      f'{foto["numero"]}. {foto["nome"]} = {stato}'
                  )

              return "\n".join(righe)

          payload = {
              "username": "ZeroTwo",
              "embeds": [
                  {
                      "title": "📱 FOTO VERTICALI",
                      "description": crea_lista(verticali)
                  },
                  {
                      "title": "🖥️ FOTO ORIZZONTALI",
                      "description": crea_lista(orizzontali)
                  }
              ]
          }

          with open("discord-payload.json", "w", encoding="utf-8") as f:
              json.dump(
                  payload,
                  f,
                  ensure_ascii=False
              )
          PY

          HTTP_CODE=$(curl \
            -sS \
            -o discord-response.txt \
            -w "%{http_code}" \
            -X PATCH \
            -H "Content-Type: application/json" \
            -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
            --data-binary @discord-payload.json \
            "${DISCORD_WEBHOOK_URL}/messages/${MESSAGE_ID}")

          echo "Discord HTTP: $HTTP_CODE"

          cat discord-response.txt || true

          if [ "$HTTP_CODE" != "200" ]; then
            echo ""
            echo "ERRORE aggiornamento lista Discord"
            exit 1
          fi

          rm -f discord-payload.json
          rm -f discord-response.txt

      - name: Salva modifiche nel repository
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          git commit -m "Cancellata foto ${NUMERO}"
          git push
