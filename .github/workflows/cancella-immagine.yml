      - name: Verifica foto cancellata da GitHub
        id: verifica_delete
        if: always()
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          git fetch origin main

          if git ls-tree -r origin/main --name-only | grep -Eq "^${NUMERO}\.(png|jpg|jpeg|webp|gif|avif)$"; then
            echo "cancellata=false" >> "$GITHUB_OUTPUT"
            echo "ERRORE: foto ${NUMERO} ancora presente su GitHub."
          else
            echo "cancellata=true" >> "$GITHUB_OUTPUT"
            echo "Foto ${NUMERO} eliminata realmente da GitHub."
          fi

      - name: Conferma cancellazione riuscita su Discord
        if: always() && steps.verifica_delete.outputs.cancellata == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          curl -sS \
            -H "Content-Type: application/json" \
            -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
            -d "{\"content\":\"🗑️ **Foto ${NUMERO} cancellata correttamente da GitHub.**\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Conferma cancellazione fallita su Discord
        if: always() && steps.verifica_delete.outputs.cancellata != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          curl -sS \
            -H "Content-Type: application/json" \
            -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
            -d "{\"content\":\"❌ **ERRORE: foto ${NUMERO} NON cancellata da GitHub.** Controlla GitHub Actions.\"}" \
            "$DISCORD_WEBHOOK_URL"
