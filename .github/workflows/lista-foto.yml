name: Pubblica lista foto su Discord

on:
  repository_dispatch:
    types: [lista_foto]

  workflow_dispatch:

jobs:
  pubblica-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Crea lista Discord
        run: |
          python3 <<'PY'
          import json

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          dati = sorted(
              dati,
              key=lambda x: int(x["numero"])
          )

          righe = []

          for foto in dati:
              stato = "✅ caricata" if foto["caricata"] else "❌ non caricata"

              righe.append(
                  f'**Foto {foto["numero"]}** — {foto["nome"]} = {stato}'
              )

          totale_caricate = sum(
              1 for foto in dati
              if foto["caricata"]
          )

          embeds = [
              {
                  "title": "📸 LISTA FOTO",
                  "description": (
                      f"**Totale foto:** {len(dati)}\n"
                      f"**Caricate:** {totale_caricate}\n"
                      f"**Non caricate:** {len(dati) - totale_caricate}"
                  )
              }
          ]

          dimensione = 20

          for i in range(0, len(righe), dimensione):
              inizio = i + 1
              fine = min(i + dimensione, len(righe))

              embeds.append({
                  "title": f"📋 FOTO {inizio} - {fine}",
                  "description": "\n".join(
                      righe[i:i + dimensione]
                  )
              })

          payload = {
              "username": "ZeroTwo",
              "embeds": embeds
          }

          with open(
              "discord-payload.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  payload,
                  f,
                  ensure_ascii=False
              )
          PY

      - name: Pubblica lista su Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -e

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "ERRORE: DISCORD_WEBHOOK_URL non configurato"
            exit 1
          fi

          HTTP_CODE=$(curl \
            -sS \
            -o discord-response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
            --data-binary @discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true")

          echo "Discord HTTP: $HTTP_CODE"

          cat discord-response.json || true

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERRORE: impossibile pubblicare la lista su Discord"
            exit 1
          fi

          echo "Lista pubblicata correttamente su Discord."

          rm -f discord-payload.json
          rm -f discord-response.json
